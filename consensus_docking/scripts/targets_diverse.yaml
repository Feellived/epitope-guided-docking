# 다양-항원 clean Fab 벤치마크 (메인 도킹/특성분석용) — 2026-07-09 작성
# 전부 2024+ 공개 = 모든 co-folder 학습 컷오프 이후(leakage-free). 나노바디 제외, Fab만.
# leakage 판정 = RCSB initial_release_date. 사슬 = auth_asym_id 기준.
# 다중카피(9VL2·9UGO)는 cognate 1:1 쌍(연속 사슬)만 keep.
# Fv(VH+VL) 세트는 make_fv.py로 파생(runs/<id>_fv).

benchmark_diverse:
  - id: 9K6J            # 기존·예측 결과 보유 (유일 RBD)
    format: Fab
    antibody: {H: A, L: B}
    antigen: {chain: C, name: SARS-CoV-2 RBD}
    keep_chains: [A, B, C]
    rcsb_release: 2026-01-07
  - id: 9XF9            # 기존
    format: Fab
    antibody: {H: H, L: L}
    antigen: {chain: A, name: Kasokero virus endonuclease}
    keep_chains: [A, H, L]
    rcsb_release: 2026-05-06
  - id: 9Y0A            # 기존
    format: Fab
    antibody: {H: A, L: B}
    antigen: {chain: C, name: Bet v 1 birch allergen}
    keep_chains: [A, B, C]
    rcsb_release: 2026-02-11
  - id: 9ZMB            # 말라리아 CSP (기생충/백신 항원)
    format: Fab
    antibody: {H: C, L: D}
    antigen: {chain: B, name: Circumsporozoite protein}
    keep_chains: [B, C, D]
    rcsb_release: 2026-05-27
  - id: 9VXL            # CD38 (골수종, Fc 효과기 — 랩)
    format: Fab
    antibody: {H: B, L: C}
    antigen: {chain: A, name: CD38 (ADP-ribosyl cyclase 1)}
    keep_chains: [A, B, C]
    rcsb_release: 2026-05-27
  - id: 9T46            # CD3 epsilon (T-engager 표적 — 랩)
    format: Fab
    antibody: {H: H, L: L}
    antigen: {chain: P, name: CD3 epsilon}
    keep_chains: [H, L, P]
    rcsb_release: 2026-05-13
  - id: 9VL2            # CD33 (AML engager/ADC — 랩) — 다중카피, cognate A/B/C
    format: Fab
    antibody: {H: C, L: B}
    antigen: {chain: A, name: CD33 myeloid antigen}
    keep_chains: [A, B, C]
    rcsb_release: 2026-05-27
  - id: 9MQR            # ADGRE5/CD97 (GPCR — 어려운/독특)
    format: Fab
    antibody: {H: D, L: E}
    antigen: {chain: A, name: ADGRE5 CD97 GPCR}
    keep_chains: [A, D, E]
    rcsb_release: 2025-09-24
  - id: 9KKJ            # Nectin-4 (종양 ADC 표적)
    format: Fab
    antibody: {H: H, L: L}
    antigen: {chain: A, name: Nectin-4}
    keep_chains: [A, H, L]
    rcsb_release: 2025-11-19
  - id: 9W43            # PD-1 (체크포인트)
    format: Fab
    antibody: {H: A, L: B}
    antigen: {chain: C, name: PD-1}
    keep_chains: [A, B, C]
    rcsb_release: 2026-07-01
  - id: 9YC6            # uPAR (종양 침윤 수용체)
    format: Fab
    antibody: {H: H, L: L}
    antigen: {chain: U, name: uPAR urokinase receptor}
    keep_chains: [H, L, U]
    rcsb_release: 2026-02-04
  - id: 9UGO            # HBV Middle S (간염 바이러스 표면) — 다중카피, cognate A/B/C
    format: Fab
    antibody: {H: B, L: A}
    antigen: {chain: C, name: HBV Middle S protein}
    keep_chains: [A, B, C]
    rcsb_release: 2026-02-18
