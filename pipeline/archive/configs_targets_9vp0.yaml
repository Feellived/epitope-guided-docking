# Consensus docking 대상 + 모델 목록
# leakage-free 골든 케이스 하나로 모든 모델을 돌려 비교표를 만든다.

golden_case: 9VP0

targets:
  9VP0:
    type: Fab
    antigen:  { name: IL-31, len: 144, chain: A }
    antibody: { heavy: H, heavy_len: 217, light: L, light_len: 222 }
    method: X-ray
    resolution: 2.1
    released: 2025-10
    note: 중화항체 vs 사이토카인, 소형 가용성 항원 (권장 골든 케이스)
  # 대안 후보 (필요시)
  # 9PIU:  Fab + mTOR FRB (92aa), 2026-06 공개  # 최신 모델까지 최안전
  # 10ZO:  나노바디 + 필로바이러스 NP (106aa), 2026-03 공개
  # 9YC3:  나노바디 + PfHAP2 (141aa), 2025-12 공개

models:
  cofolders: [boltz2, chai1, protenix, tfold_ag, af3]   # 서열 -> 복합체 (ipTM류 제공)
  physics:   [haddock3, cluspro, megadock, frodock]     # 구조 -> 포즈 (Phase B)
  scorers:   [dockq, deeprank_ab, deeprank_gnn_esm]     # 재랭킹/평가

success_metric:
  name: DockQ
  threshold: 0.23        # >= 0.23 = acceptable (CAPRI)
  interface: antibody-antigen   # 다중사슬이면 Ab-Ag interface만 성공지표로
